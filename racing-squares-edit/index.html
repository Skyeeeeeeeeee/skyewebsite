<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30.1"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="a-roll"
        class="clip"
        src="7e26d9bf-2D_Racing_Squares_.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="30.1"
        data-track-index="0"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"
      ></video>
      <audio
        id="a-roll-audio"
        src="7e26d9bf-2D_Racing_Squares_.mp4"
        data-start="0"
        data-duration="30.1"
        data-track-index="2"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":0.15,"v":1},{"t":0.4,"v":0.3},{"t":1.88,"v":0.3},{"t":2.3,"v":1}]}]}'
      ></audio>

      <audio
        id="voiceover"
        class="clip"
        src="assets/voiceover-pick-a-color.wav"
        data-start="0.3"
        data-duration="1.578667"
        data-track-index="3"
        data-volume="1"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Subtle camera push on the racing-squares clip: zoom in 0-2s,
      // hold at the zoomed level 2-4s, zoom back out 4-6s.
      gsap.set("#a-roll", { transformOrigin: "center center" });
      tl.to("#a-roll", { scale: 1.04, ease: "sine.inOut", duration: 2 }, 0);
      tl.to("#a-roll", { scale: 1, ease: "sine.inOut", duration: 2 }, 4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
