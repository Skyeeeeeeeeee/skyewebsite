<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-fx">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="grain"></div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">Skye</span>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="notes">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" opacity="0"/><path d="M6 3.5h9.5L20 8v12.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14.5 3.5V8H19" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 12h8M8 15.5h8M8 9h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Notes</span>
    </button>
    <button class="tab" data-view="events">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15.5" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v3.5M16 3v3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 13v4M10 15h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Events</span>
    </button>
    <button class="tab" data-view="memories">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 20.5s-7.5-4.6-9.8-9.3C.6 7.7 2.4 4 6 4c2 0 3.4 1 4.5 2.6C11.6 5 13 4 15 4c3.6 0 5.4 3.7 3.8 7.2C16.5 15.9 12 20.5 12 20.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Memories</span>
    </button>
    <button class="tab" data-view="links">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9.5 14.5 14.5 9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M11 6.5 12.4 5A4 4 0 1 1 18 10.6l-1.5 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M13 17.5 11.6 19A4 4 0 1 1 6 13.4l1.5-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Links</span>
    </button>
    <div class="tab-glow" id="tabGlow"></div>
  </nav>

  <div class="topbar-right">
    <span class="save-indicator" id="saveIndicator">Saved</span>
  </div>
</header>

<main class="content">

  <!-- NOTES -->
  <section class="view active" id="view-notes">
    <div class="view-head">
      <h1>Notes</h1>
      <p>An open space. Write whatever comes to mind.</p>
    </div>
    <div class="notes-wrap">
      <textarea id="notesArea" placeholder="Start typing..." spellcheck="false"></textarea>
    </div>
  </section>

  <!-- EVENTS -->
  <section class="view" id="view-events">
    <div class="view-head">
      <h1>Events</h1>
      <p>Plan something. Give it a name and a description.</p>
      <button class="new-btn" data-open="events">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        New Event
      </button>
    </div>

    <div class="composer" id="composer-events">
      <input type="text" id="events-title" placeholder="Event name" maxlength="80">
      <textarea id="events-desc" placeholder="What's this event about?" maxlength="600"></textarea>
      <div class="composer-actions">
        <button class="btn-ghost" data-cancel="events">Cancel</button>
        <button class="btn-solid" data-save="events">Create Event</button>
      </div>
    </div>

    <div class="grid" id="list-events"></div>
    <div class="empty" id="empty-events">
      <div class="empty-icon">✦</div>
      <p>No events yet</p>
    </div>
  </section>

  <!-- MEMORIES -->
  <section class="view" id="view-memories">
    <div class="view-head">
      <h1>Memories</h1>
      <p>Hold on to a moment. Name it and describe it.</p>
      <button class="new-btn" data-open="memories">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        New Memory
      </button>
    </div>

    <div class="composer" id="composer-memories">
      <input type="text" id="memories-title" placeholder="Memory name" maxlength="80">
      <textarea id="memories-desc" placeholder="Describe this memory..." maxlength="600"></textarea>
      <div class="composer-actions">
        <button class="btn-ghost" data-cancel="memories">Cancel</button>
        <button class="btn-solid" data-save="memories">Save Memory</button>
      </div>
    </div>

    <div class="grid" id="list-memories"></div>
    <div class="empty" id="empty-memories">
      <div class="empty-icon">✦</div>
      <p>No memories yet</p>
    </div>
  </section>

  <!-- LINKS -->
  <section class="view" id="view-links">
    <div class="view-head">
      <h1>Links</h1>
      <p>Save a website. It'll show a preview you can click into.</p>
    </div>

    <form class="link-add" id="linkForm">
      <input type="text" id="linkInput" placeholder="Paste a URL, e.g. wikipedia.org" autocomplete="off">
      <button type="submit" class="btn-solid">Add Link</button>
    </form>

    <div class="grid links-grid" id="list-links"></div>
    <div class="empty" id="empty-links">
      <div class="empty-icon">✦</div>
      <p>No links yet</p>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
